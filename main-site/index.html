<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>MRT Station Guesser | UwU Apps</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Guess the Singapore MRT or LRT station from a masked name. Letters reveal as the clock runs, and every hint costs points.">

    <script>
        (function () {
            var k = "mrtguessr";
            var m = localStorage.getItem(k + ".mode") || "light";

            // Time based mode. Resolved here rather than in theme.js because
            // theme.js runs after first paint, and an evening reader would
            // otherwise watch a white page turn dark. Keep the two hours in
            // step with LIGHT_FROM_HOUR and LIGHT_UNTIL_HOUR in js/theme.js.
            document.documentElement.setAttribute("data-mode-preference", m);
            if (m === "time") {
                var h = new Date().getHours();
                m = h >= 9 && h < 18 ? "light" : "dark";
            }

            var c = localStorage.getItem(k + ".colorTheme") || "classic";
            document.documentElement.setAttribute("data-mode", m);
            document.documentElement.setAttribute("data-color-theme", c);
        })();
    </script>

<body>
    <div id="app" class="page">
        <header class="topbar glass">
            <div class="brand">
                <img class="brand-icon" src="/SNG-192.png" alt="" width="28" height="28">
                <h1 class="brand-name">MRT Station Guesser</h1>
            </div>
            <div class="topbar-actions">
                <button id="themeBtn" class="icon-btn" type="button" aria-haspopup="dialog" aria-label="Theme">
                    <span data-icon="sun"></span>
                </button>
                <a id="coffeeBtn" class="icon-btn" href="https://donate.stripe.com/28o2akeAr3hv0DK6oo"
                    target="_blank" rel="noopener noreferrer" aria-label="Buy Augy a Coffee">
                    <span data-icon="coffee"></span>
                </a>
            </div>
        </header>

        <!-- The game goes here in build step 4, after the mechanic has been
             tried on Telegram. -->
        <main class="card glass" aria-labelledby="soonTitle">
            <span class="card-icon" data-icon="train"></span>
            <h2 id="soonTitle">Almost ready to play</h2>
            <p>Guess the station from its masked name. Letters reveal as the clock runs, and every hint costs points.</p>
        </main>

        <footer class="foot">
            Made with <span class="footer-heart" data-icon="heartFilled" aria-label="love" role="img"></span> by Augy
        </footer>
    </div>

    <!-- Theme picker modal -->
    <div class="modal-backdrop hidden" id="themeModal">
        <div class="modal glass" role="dialog" aria-modal="true" aria-labelledby="themeModalTitle">
            <div class="modal-head">
                <h2 id="themeModalTitle">Theme</h2>
                <button class="icon-btn small" type="button" data-close-modal="themeModal" aria-label="Close">
                    <span data-icon="close"></span>
                </button>
            </div>
            <p class="modal-section-label">Mode</p>
            <div class="mode-toggle" id="modeToggle">
                <button class="mode-btn" type="button" data-mode="light" aria-pressed="false"><span data-icon="sun"></span>Light</button>
                <button class="mode-btn" type="button" data-mode="dark" aria-pressed="false"><span data-icon="moon"></span>Dark</button>
                <button class="mode-btn mode-btn-wide" type="button" data-mode="time" aria-pressed="false"><span data-icon="clock"></span>Time-based</button>
            </div>
            <p class="mode-note" id="modeNote" hidden></p>
            <p class="modal-section-label">Brand colour</p>
            <div class="swatch-grid" id="swatchGrid"></div>
        </div>
    </div>

    <script type="module" src="/js/app.js"></script>
</body>
